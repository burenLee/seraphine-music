name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
              libasound2-dev \
              libxslt1.1 \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - name: Pnpm Cache
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: 'pnpm-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: pnpm-${{ matrix.os }}-${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: 'rust-${{ matrix.os }}-${{ matrix.target }}'
          restore-keys: 'rust-${{ matrix.os }}-${{ matrix.target }}'

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --dangerously-allow-all-builds

      # ============================================================
      # Tag 推送：tauri-action 一站式完成构建 + 签名 + 创建 Release
      #           + 上传产物 + 生成 latest.json（供 updater 检查更新）
      # 多平台矩阵并发：首个 job 创建 Release，后续 job 追加产物并
      # 合并 latest.json 的 platforms 字段（action 内部处理并发）
      # ============================================================
      # 从 CHANGELOG.md 提取当前 tag 对应版本的更新说明，
      # 作为 Release body（GitHub Release 界面 / latest.json notes / 应用内弹窗共用）
      - name: Extract changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk -v v="$VERSION" '
            BEGIN { target = "## [" v "]" }
            index($0, target) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名私钥：构建时生成 .sig 文件
          # 本地构建需先 export TAURI_SIGNING_PRIVATE_KEY="..." 再执行 pnpm tauri build
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无密码私钥时此 secret 为空，不影响构建
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Seraphine Music ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          # 使用 CHANGELOG.md 中对应版本的更新说明（不再自动生成）
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Windows 同时生成 NSIS + MSI，updater 优先使用 NSIS（支持 passive 安装模式）
          updaterJsonPreferNsis: true
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}

      # ============================================================
      # 手动触发（workflow_dispatch）：仅构建 + 签名，不发布 Release
      # 产物上传到 Actions Artifacts 供下载验证
      # ============================================================
      - name: Build Tauri bundle (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundle artifacts (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: seraphine-music-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
